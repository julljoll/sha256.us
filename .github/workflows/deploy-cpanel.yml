name: Deploy to cPanel via FTPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy via FTPS to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER || secrets.FTP_SERVER || 'ftp.sha256.us' }}
          username: ${{ secrets.CPANEL_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT || secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: true
